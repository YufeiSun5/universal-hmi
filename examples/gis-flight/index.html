<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>站区 · 空间总览</title>
  <style>html,body{margin:0;background:#142e42}#loading{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;justify-items:center;gap:16px;background:#142e42;color:#e2edf5;font:15px system-ui,sans-serif}#loading[hidden]{display:none}#loading:before{content:"";width:30px;height:30px;border:3px solid #ffffff30;border-top-color:#a9d8f1;border-radius:50%;animation:map-spin 1s linear infinite}@keyframes map-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#loading:before{animation:none}}</style>
  <link rel="icon" href="data:,">
  <style>
    #loading.station-startup{display:block;place-content:start;place-items:stretch;text-align:left;overflow:auto;padding:130px max(24px,calc((100vw - 1080px)/2)) 100px;background:linear-gradient(145deg,#142e42,#204b63);box-sizing:border-box}
    #loading.station-startup[hidden]{display:none}#loading.station-startup:before{display:none}
    .station-startup>strong,.station-startup>span{display:block;margin-bottom:12px}
    .startup-stations{display:flex;gap:8px;flex-wrap:wrap;max-height:28vh;overflow:auto;margin:18px 0}
    .station-startup button{font:inherit;color:#e6f1fa;background:#234b65;border:1px solid #7293ab;border-radius:6px;padding:10px 15px;cursor:pointer}
    .station-startup button[aria-pressed=true]{background:#39729a;border-color:#b6d9f1}.startup-detail{background:#ffffffef;color:#213e51;padding:16px 20px;max-width:600px;border-radius:8px}
    .startup-detail h2{margin:0 0 12px;font-size:20px}.startup-detail h3{font-size:16px}.startup-reading{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid #d9e3eb}
    @media(max-width:600px){#loading.station-startup{padding:18px 16px 100px}.startup-stations{max-height:24vh}}
  </style>
  <link rel="stylesheet" href="vendor/cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="flight.css">
  <link rel="stylesheet" href="stations.css">
  <script src="startup.js" defer></script>
  <script src="vendor/cesium/Cesium.js" defer></script>
  <script src="sea.js" defer></script>
  <script src="stations.js" defer></script>
  <script src="celestial.js" defer></script>
  <script src="orbital-scene.js" defer></script>
  <script src="tour.js" defer></script>
  <script src="flight.js" defer></script>
</head>
<body>
  <main id="app">
    <canvas id="space" aria-hidden="true"></canvas>
    <canvas id="celestial" aria-hidden="true"></canvas>
    <div id="globe" aria-label="可拖动和缩放的站区地图"></div>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">◎</span><div><strong>站区 · 空间总览</strong><span class="subtitle">UNIVERSAL HMI / GIS</span></div></div>
      <div class="top-actions"><span class="local-badge">本地影像</span><a href="embed.html" id="embed-link">嵌入预览 ↗</a></div>
    </header>
    <div id="tour-controls" role="group" aria-label="地图播放控制" hidden>
      <button id="tour-toggle" type="button" aria-label="静态展示：地图浮窗轮播" title="静态展示：地图浮窗轮播" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19l-3 1-6-3V4l6 3 6-3 6 3v4M9 7v13M15 4v7"/><path class="mode-mark" d="M16 13l5 4-5 4z"/></svg></button>
      <button id="replay" type="button" aria-label="演示模式：地球与地图循环" title="演示模式：地球与地图循环" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.5 7M4 4v6h6"/></svg></button>
    </div>
    <div id="loading" role="status">正在加载站区地图…</div>
    <div id="error" role="alert" hidden></div>
    <aside class="source-info"><strong id="source-title">全球自然地理底图</strong><span id="source-detail">NASA Blue Marble · 公共领域</span><span>站址为示意，实时数据待绑定</span></aside>
    <div id="credits"></div>
  </main>
</body>
</html>
