name: universal_hmi
description: PC-first acquisition and analysis workspace.
publish_to: none
version: 0.1.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: 1.5.0
  file_selector: 1.0.4
  web: 1.1.1
  shared_preferences: 2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE-Noto-CJK.txt
    - assets/fonts/README.txt
    - assets/fonts/LICENSE-Roboto.txt
  fonts:
    - family: HmiCJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
