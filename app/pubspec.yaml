name: universal_hmi
description: PC-first acquisition and analysis workspace.
publish_to: none
version: 0.1.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: 1.5.0
  crypto: ^3.0.6
  flutter_svg: 2.3.0
  file_selector: 1.0.4
  web: 1.1.1
  shared_preferences: 2.5.3
  webview_windows:
    path: vendor/webview_windows
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/login/
    - assets/monitor/
    - assets/process/catalog.json
    - assets/process/LICENSE-FUXA.txt
    - assets/process/symbols/
    - assets/process/examples/
    - assets/process/templates/
    - assets/fonts/LICENSE-Noto-CJK.txt
    - assets/fonts/README.txt
    - assets/fonts/LICENSE-Roboto.txt
  fonts:
    - family: HmiCJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf


