name: Bootstrap native files and verify Windows Go
on:
  push:
    branches: [bootstrap-native]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false
      - name: Format, test and build Windows backend
        working-directory: backend
        run: |
          gofmt -w .
          go test ./...
          go vet ./...
          go build -o ../dist/universal-hmi-server.exe ./cmd/server
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Generate standard runners and lock dependencies
        working-directory: app
        run: |
          flutter create --no-pub --platforms=windows,web --project-name universal_hmi .
          git restore -- lib pubspec.yaml analysis_options.yaml test/workspace_test.dart
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }
          flutter pub get
      - name: Export only public generated project files
        run: python ci/export_bootstrap.py
      - uses: actions/upload-artifact@v4
        with:
          name: go-server-windows
          path: dist/universal-hmi-server.exe
