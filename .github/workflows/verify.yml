name: Verify Go and Flutter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            extension: ''
          - os: windows-2022
            target: windows
            extension: '.exe'
          - os: macos-14
            target: macos
            extension: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - name: Preserve identical checkout bytes across operating systems
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: true
      - name: Local MQTT fixture tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients
      - name: Read-only source and dependency gates
        run: |
          set -euo pipefail
          test -z "$(gofmt -l ./cmd ./internal)"
          go mod verify
          go test -mod=readonly -race ./...
          go vet -mod=readonly ./...
          go build -mod=readonly -o ../dist/universal-hmi-server${{ matrix.extension }} ./cmd/server
          git diff --exit-code
      - name: Universal macOS backend
        if: matrix.target == 'macos'
        run: |
          CGO_ENABLED=0 GOARCH=arm64 go build -mod=readonly -o ../dist/server-arm64 ./cmd/server
          CGO_ENABLED=0 GOARCH=amd64 go build -mod=readonly -o ../dist/server-amd64 ./cmd/server
          lipo -create ../dist/server-arm64 ../dist/server-amd64 -output ../dist/universal-hmi-server
          lipo ../dist/universal-hmi-server -verify_arch arm64 x86_64
      - name: Release gate fault-injection tests
        if: matrix.target == 'linux'
        run: |
          python ../ci/test_release_gates.py
          python -m unittest discover -s ../ci -p test_installers.py
          python -m unittest discover -s ../ci -p test_macos_packaging.py
          python -m unittest discover -s ../ci -p test_windows_runtime.py
          python -m unittest discover -s ../ci -p test_installer_smoke.py
          python -m unittest discover -s ../ci -p test_extended_regressions.py
      - name: Real local MQTT and KIO capacity contracts
        if: matrix.target == 'linux'
        run: python ../ci/run_backend_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: go-server-${{ matrix.target }}
          path: dist/universal-hmi-server${{ matrix.extension }}
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux' && always()
        with:
          name: backend-capacity-evidence
          path: dist/backend-evidence

  flutter:
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: web
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-14
            target: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Preserve identical checkout bytes across operating systems
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Linux desktop libraries and local fixture tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libegl1 libegl-mesa0 libgl1-mesa-dri liblzma-dev xvfb fonts-noto-cjk mosquitto mosquitto-clients imagemagick xdotool x11-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline font assets
        run: |
          python -m pip install -r ../ci/requirements-fonts.txt
          python ../ci/prepare_fonts.py
          python -m unittest discover -s ../ci -p test_prepare_fonts.py
      - name: Use pinned local macOS plugin Swift packages
        if: matrix.target == 'macos'
        run: flutter config --enable-swift-package-manager
      - name: Resolve enforced dependency lock
        run: flutter pub get --enforce-lockfile
      - name: Read-only format gate
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Workspace tests
        run: flutter test --no-pub test
      - uses: actions/download-artifact@v4
        if: matrix.target != 'web'
        with:
          name: go-server-${{ matrix.target }}
          path: dist
      - name: Native profile and real 15,000-point KIO workflow
        if: matrix.target == 'linux'
        run: python ../ci/run_linux_ui.py --xvfb --flow --duration 120
      # Profile/debug tests complete before a fresh serial release build.
      - name: Release build and provenance
        run: python ../ci/build_release.py ${{ matrix.target }}
      - name: Verify source and locks remain unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'web'
        with:
          name: flutter-web-release
          path: app/build/web
          include-hidden-files: true
      - name: Bundle local backend with desktop client
        if: matrix.target != 'web'
        run: python ../ci/package_desktop.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: universal-hmi-windows-core
          path: app/build/windows/x64/runner/Release
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: universal-hmi-linux-core
          path: app/build/linux/x64/release/bundle
          include-hidden-files: true
      - name: Preserve macOS bundle permissions and framework symlinks
        if: matrix.target == 'macos'
        run: tar -czf ../dist/macos-core.tar.gz -C "build/macos/Build/Products/Release/Universal HMI.app" .
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'macos'
        with:
          name: universal-hmi-macos-core
          path: dist/macos-core.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux' && always()
        with:
          name: linux-native-profile-evidence
          path: dist/profile
      - uses: actions/download-artifact@v4
        if: matrix.target == 'web'
        with:
          name: go-server-linux
          path: dist
      - name: Browser file workflow
        if: matrix.target == 'web'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python ../ci/browser_flow.py
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'web' && always()
        with:
          name: browser-ui-evidence
          path: dist/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-provenance-${{ matrix.target }}
          path: dist/provenance

  packages:
    needs: flutter
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-14
            target: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve identical checkout bytes across operating systems
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web-release
          path: dist/web
      - uses: actions/download-artifact@v4
        if: matrix.target != 'macos'
        with:
          name: universal-hmi-${{ matrix.target }}-core
          path: dist/${{ matrix.target }}
      - uses: actions/download-artifact@v4
        if: matrix.target == 'macos'
        with:
          name: universal-hmi-macos-core
          path: dist
      - name: Restore macOS app bundle
        if: matrix.target == 'macos'
        run: mkdir -p dist/macos && tar -xzf dist/macos-core.tar.gz -C dist/macos
      - name: Assemble verified desktop and browser packages
        run: python ci/package_final.py --targets ${{ matrix.target }}
      - name: Build native installable distribution
        run: python ci/build_installers.py ${{ matrix.target }} --expected-revision "$(git rev-parse HEAD)"
      - name: Install Linux runtime/display dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libegl1 libegl-mesa0 libgl1-mesa-dri liblzma5 fonts-noto-cjk xdotool x11-utils imagemagick
      - name: Install, update, serve bundled Web and uninstall in isolation
        run: |
          if [ '${{ matrix.target }}' = linux ]; then
            xvfb-run -a python ci/installer_smoke.py linux --system-deb
          else
            python ci/installer_smoke.py ${{ matrix.target }}
          fi
      - name: Verify assembled Linux package and normal-close lifecycle
        if: matrix.target == 'linux'
        run: |
          python ci/package_smoke.py --xvfb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-evidence-${{ matrix.target }}
          path: dist/installer-evidence
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux' && always()
        with:
          name: final-package-evidence
          path: dist/package-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: universal-hmi-${{ matrix.target }}-installer
          path: dist/installers
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: universal-hmi-linux
          path: |
            dist/final/universal-hmi-linux-x64.tar.gz
            dist/final/SHA256SUMS
