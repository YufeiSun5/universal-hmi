name: Verify Go and Flutter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            extension: ''
          - os: windows-2022
            target: windows
            extension: '.exe'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false
      - name: Test, vet and build
        run: |
          go mod tidy
          gofmt -w ./cmd ./internal
          go test -race ./...
          go vet ./...
          python ../ci/export_generated.py backend
          go build -o ../dist/universal-hmi-server${{ matrix.extension }} ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: go-server-${{ matrix.target }}
          path: dist/universal-hmi-server${{ matrix.extension }}

  flutter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: web
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Linux desktop libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - name: Resolve locked dependencies
        run: |
          flutter create --platforms=linux --project-name universal_hmi .
          flutter pub get
          python -c "import pathlib; pathlib.Path('test/widget_test.dart').unlink(missing_ok=True)"
          python ../ci/export_generated.py app
      - name: Static analysis
        run: flutter analyze
      - name: Workspace tests
        run: flutter test
      - name: Release build
        run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'web'
        with:
          name: flutter-web-release
          path: app/build/web
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: flutter-windows-release
          path: app/build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: flutter-linux-release
          path: app/build/linux/x64/release/bundle
