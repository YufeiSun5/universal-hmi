name: Verify Go and Flutter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            extension: ''
          - os: windows-2022
            target: windows
            extension: '.exe'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: true
      - name: Test, vet and build
        run: |
          go mod tidy
          gofmt -w ./cmd ./internal
          go test -race ./...
          go vet ./...
          python ../ci/export_generated.py backend
          go build -o ../dist/universal-hmi-server${{ matrix.extension }} ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: go-server-${{ matrix.target }}
          path: dist/universal-hmi-server${{ matrix.extension }}

  flutter:
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: web
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Linux desktop libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb fonts-noto-cjk mosquitto mosquitto-clients imagemagick xdotool
      - name: Resolve locked dependencies
        run: |
          flutter create --platforms=linux --project-name universal_hmi .
          flutter pub get
          python -c "import pathlib; pathlib.Path('test/widget_test.dart').unlink(missing_ok=True)"
          python ../ci/export_generated.py app
      - name: Format and apply supported lint fixes
        run: |
          dart format lib test integration_test
          dart fix --apply
          dart format lib test integration_test
          dart fix --apply
          dart format lib test integration_test
          python ../ci/export_generated.py app
      - name: Static analysis
        run: flutter analyze
      - name: Workspace tests
        run: flutter test test
      - name: Release build
        run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'web'
        with:
          name: flutter-web-release
          path: app/build/web
      - uses: actions/download-artifact@v4
        if: matrix.target != 'web'
        with:
          name: go-server-${{ matrix.target }}
          path: dist
      - name: Bundle local backend with desktop client
        if: matrix.target != 'web'
        run: python ../ci/package_desktop.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: universal-hmi-windows-core
          path: app/build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: universal-hmi-linux-core
          path: app/build/linux/x64/release/bundle
      - name: Linux native UI and real MQTT workflow
        if: matrix.target == 'linux'
        run: python ../ci/run_linux_ui.py
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux' && always()
        with:
          name: linux-ui-evidence
          path: dist/screenshots
      - uses: actions/download-artifact@v4
        if: matrix.target == 'web'
        with:
          name: go-server-linux
          path: dist
      - name: Browser file workflow
        if: matrix.target == 'web'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python ../ci/browser_flow.py
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'web' && always()
        with:
          name: browser-ui-evidence
          path: dist/screenshots

  packages:
    needs: flutter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web-release
          path: dist/web
      - uses: actions/download-artifact@v4
        with:
          name: universal-hmi-linux-core
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: universal-hmi-windows-core
          path: dist/windows
      - name: Assemble desktop and browser packages
        run: python ci/package_final.py
      - name: Verify assembled Linux desktop package
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 liblzma5 fonts-noto-cjk
          python ci/package_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: universal-hmi-linux
          path: dist/final/universal-hmi-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: universal-hmi-windows
          path: dist/windows
