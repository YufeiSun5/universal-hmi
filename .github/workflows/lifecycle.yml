name: Linux lifecycle regression

on:
  pull_request:
    paths:
      - 'app/linux/runner/**'
      - 'app/lib/**'
      - 'app/test/backend_*'
      - 'ci/package_smoke.py'
      - 'ci/test_package_process.py'
      - '.github/workflows/lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux libraries and isolated regression display
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libegl1 libegl-mesa0 libgl1-mesa-dri liblzma-dev xvfb fonts-noto-cjk xdotool x11-utils imagemagick
      - name: Prepare pinned font assets
        run: |
          python -m pip install -r ci/requirements-fonts.txt
          python ci/prepare_fonts.py
      - name: Read-only dependencies and focused lifecycle tests
        run: |
          (cd backend && go mod verify && go build -mod=readonly -o ../dist/universal-hmi-server ./cmd/server)
          (cd app && flutter pub get --enforce-lockfile && flutter analyze --no-pub && flutter test --no-pub test/backend_health_test.dart test/backend_process_test.dart)
          python -m unittest discover -s ci -p test_package_process.py
          git diff --exit-code
      - name: Build and stage current verified release inputs serially
        run: |
          python ci/build_release.py linux
          python ci/build_release.py web
          python ci/package_desktop.py linux
          python ci/package_final.py --targets linux --stage-local
          git diff --exit-code
      - name: Owned close and ten immediate reused-window closes
        run: python ci/package_smoke.py --xvfb --reuse-close-attempts 10 --output dist/lifecycle-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-lifecycle-evidence
          path: dist/lifecycle-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-lifecycle-provenance
          path: dist/provenance
